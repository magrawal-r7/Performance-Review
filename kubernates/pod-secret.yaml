apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
spec:
  containers:
    - name: test-container
      image: nginx
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_USER
        - name: DB_FAIL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_FAIL
